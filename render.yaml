services:
  - type: web
    name: ai-political-poster-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 120
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        sync: false
      - key: PORT
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: MAX_REGENERATIONS
        sync: false
      - key: GENERATION_RATE_LIMIT
        sync: false
      - key: GENERATION_CONCURRENCY
        sync: false
      - key: TRUST_PROXY_HOPS
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
