<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Noto Sans Bengali','Nirmala UI','Vrinda','Hind Siliguri',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b6b3a"/>
      <stop offset="1" stop-color="#06402a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <g id="person">
      <circle cx="0" cy="-18" r="22" fill="#cfd8dc"/>
      <path d="M-40 40 Q-40 0 0 0 Q40 0 40 40 Z" fill="#cfd8dc"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="#eeeeee"/>

  <!-- POSTER 1: Victory Day -->
  <g>
    <rect x="0" y="0" width="800" height="1000" fill="url(#g1)"/>
    <circle cx="400" cy="470" r="260" fill="#d6212a" opacity="0.9"/>
    <!-- border -->
    <rect x="18" y="18" width="764" height="964" fill="none" stroke="#f2c94c" stroke-width="6"/>
    <rect x="30" y="30" width="740" height="940" fill="none" stroke="#f2c94c" stroke-width="2"/>
    <!-- headline -->
    <text x="400" y="130" text-anchor="middle" font-size="26" fill="#f2c94c" font-weight="700">১৬ ডিসেম্বর</text>
    <text x="400" y="225" text-anchor="middle" font-size="84" fill="#ffffff" font-weight="800">মহান বিজয় দিবস</text>
    <text x="400" y="278" text-anchor="middle" font-size="26" fill="#ffffff">বিজয়ের শুভেচ্ছা ও অভিনন্দন</text>
    <!-- 3 photo slots -->
    <g fill="#ffffff" stroke="#f2c94c" stroke-width="5">
      <circle cx="200" cy="420" r="85"/>
      <circle cx="400" cy="400" r="105"/>
      <circle cx="600" cy="420" r="85"/>
    </g>
    <use href="#person" x="200" y="425"/>
    <use href="#person" x="400" y="410" transform="translate(0 0)"/>
    <use href="#person" x="600" y="425"/>
    <text x="200" y="540" text-anchor="middle" font-size="20" fill="#fff">ছবি ১</text>
    <text x="400" y="545" text-anchor="middle" font-size="20" fill="#fff">ছবি ২</text>
    <text x="600" y="540" text-anchor="middle" font-size="20" fill="#fff">ছবি ৩</text>
    <!-- rice paddy -->
    <g stroke="#f2c94c" stroke-width="3" fill="none" opacity="0.9">
      <path d="M60 760 Q90 650 140 600"/><path d="M90 760 Q110 660 170 620"/>
      <path d="M740 760 Q710 650 660 600"/><path d="M710 760 Q690 660 630 620"/>
    </g>
    <g fill="#f2c94c">
      <ellipse cx="140" cy="600" rx="6" ry="14"/><ellipse cx="170" cy="620" rx="6" ry="14"/>
      <ellipse cx="660" cy="600" rx="6" ry="14"/><ellipse cx="630" cy="620" rx="6" ry="14"/>
    </g>
    <!-- party symbol placeholder -->
    <circle cx="400" cy="680" r="55" fill="#ffffff" stroke="#f2c94c" stroke-width="4"/>
    <text x="400" y="688" text-anchor="middle" font-size="22" fill="#06402a" font-weight="700">প্রতীক</text>
    <text x="400" y="775" text-anchor="middle" font-size="30" fill="#ffffff" font-weight="700">জয় হোক মানুষের</text>
    <!-- footer -->
    <rect x="30" y="830" width="740" height="140" fill="#d6212a"/>
    <text x="400" y="885" text-anchor="middle" font-size="40" fill="#fff" font-weight="800">মোঃ আব্দুল করিম</text>
    <text x="400" y="925" text-anchor="middle" font-size="26" fill="#ffffff">সভাপতি, ৫ নং ওয়ার্ড শাখা, সদর উপজেলা, ঢাকা</text>
    <text x="400" y="958" text-anchor="middle" font-size="20" fill="#f2c94c">প্রচারে: ওয়ার্ড কমিটি</text>
  </g>

  <!-- POSTER 2: Condolence -->
  <g transform="translate(800 0)">
    <rect x="0" y="0" width="800" height="1000" fill="url(#g2)"/>
    <rect x="18" y="18" width="764" height="964" fill="none" stroke="#bdbdbd" stroke-width="4"/>
    <!-- corner flourishes -->
    <g stroke="#bdbdbd" stroke-width="2" fill="none">
      <path d="M40 120 Q40 40 120 40"/><path d="M760 120 Q760 40 680 40"/>
      <path d="M40 880 Q40 960 120 960" opacity="0"/>
    </g>
    <!-- headline -->
    <text x="400" y="140" text-anchor="middle" font-size="30" fill="#bdbdbd">ইন্না লিল্লাহি ওয়া ইন্না ইলাইহি রাজিউন</text>
    <text x="400" y="240" text-anchor="middle" font-size="76" fill="#ffffff" font-weight="800">গভীর শোক</text>
    <text x="400" y="310" text-anchor="middle" font-size="46" fill="#ffffff" font-weight="700">ও শ্রদ্ধাঞ্জলি</text>
    <!-- photo slot -->
    <ellipse cx="400" cy="520" rx="150" ry="180" fill="#ffffff" stroke="#bdbdbd" stroke-width="5"/>
    <use href="#person" x="400" y="530" transform="translate(400 530) scale(2.2) translate(-400 -530)"/>
    <text x="400" y="735" text-anchor="middle" font-size="30" fill="#ffffff" font-weight="700">মরহুম আলহাজ্ব রহিম উদ্দিন</text>
    <text x="400" y="775" text-anchor="middle" font-size="22" fill="#bdbdbd">আমরা তাঁর বিদেহী আত্মার মাগফিরাত কামনা করি</text>
    <!-- candle / flower dots -->
    <g fill="#bdbdbd" opacity="0.6">
      <circle cx="90" cy="520" r="6"/><circle cx="90" cy="560" r="4"/><circle cx="90" cy="600" r="6"/>
      <circle cx="710" cy="520" r="6"/><circle cx="710" cy="560" r="4"/><circle cx="710" cy="600" r="6"/>
    </g>
    <!-- footer -->
    <rect x="30" y="830" width="740" height="140" fill="#1b1b1b" stroke="#bdbdbd" stroke-width="2"/>
    <text x="400" y="885" text-anchor="middle" font-size="40" fill="#fff" font-weight="800">মোঃ আব্দুল করিম</text>
    <text x="400" y="925" text-anchor="middle" font-size="26" fill="#ffffff">সভাপতি, ৫ নং ওয়ার্ড শাখা, সদর উপজেলা, ঢাকা</text>
    <text x="400" y="958" text-anchor="middle" font-size="20" fill="#bdbdbd">প্রচারে: ওয়ার্ড কমিটি</text>
  </g>
</svg>
